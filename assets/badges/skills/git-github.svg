<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 38" width="150" height="38">
  <defs>
    <!-- Rich Metallic Luster Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- 3D Specular Glass Highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Metallic Specular Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Dynamic Lustre Beam (Motion Sweep) -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <mask id="badgeMask">
      <rect x="1" y="1" width="148" height="36" rx="7" fill="#ffffff" />
    </mask>

    <style>
      @keyframes gleam {
        0% { transform: translateX(-140px) skewX(-25deg); opacity: 0; }
        8% { opacity: 0.9; }
        28% { transform: translateX(270px) skewX(-25deg); opacity: 0.9; }
        35%, 100% { transform: translateX(270px) skewX(-25deg); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 1px rgba(255,255,255,0.4)); }
        50% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 8px #f97316); }
      }
      .sheen {
        animation: gleam 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        animation-delay: 2.25s;
      }
      .logo-icon {
        animation: pulseGlow 2.5s ease-in-out infinite;
        animation-delay: 2.25s;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Shadow Base -->
  <rect x="1" y="2" width="148" height="35" rx="7" fill="#000000" opacity="0.35" />

  <!-- Main Badge Pill -->
  <rect x="1" y="1" width="148" height="35" rx="7" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Glass Top Reflection for 3D Luster -->
  <rect x="1" y="1" width="148" height="17" rx="7" fill="url(#glassGrad)" />

  <!-- Animated Moving Lustre Light Sweep -->
  <g mask="url(#badgeMask)">
    <rect x="-120" y="-10" width="55" height="60" fill="url(#sheenGrad)" class="sheen" />
  </g>

  <!-- Icon + Text Content -->
  <g transform="translate(12, 9)" class="logo-icon">
    <g transform="scale(0.85)" fill="#ffffff"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></g>
  </g>

  <text x="40" y="23" class="badge-text">Git &amp; GitHub</text>
</svg>
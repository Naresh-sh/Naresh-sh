<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 38" width="168" height="38">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <mask id="badgeMask">
      <rect x="1" y="1" width="166" height="36" rx="7" fill="#ffffff" />
    </mask>

    <style>
      @keyframes gleam {
        0% { transform: translateX(-140px) skewX(-25deg); opacity: 0; }
        8% { opacity: 0.9; }
        28% { transform: translateX(288px) skewX(-25deg); opacity: 0.9; }
        35%, 100% { transform: translateX(288px) skewX(-25deg); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 1px rgba(255,255,255,0.4)); }
        50% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 8px #3b82f6); }
      }
      .sheen {
        animation: gleam 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        animation-delay: 0.1s;
      }
      .logo-icon {
        animation: pulseGlow 2.5s ease-in-out infinite;
        animation-delay: 0.1s;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <rect x="1" y="2" width="166" height="35" rx="7" fill="#000000" opacity="0.35" />
  <rect x="1" y="1" width="166" height="35" rx="7" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />
  <rect x="1" y="1" width="166" height="17" rx="7" fill="url(#glassGrad)" />

  <g mask="url(#badgeMask)">
    <rect x="-120" y="-10" width="55" height="60" fill="url(#sheenGrad)" class="sheen" />
  </g>

  <g transform="translate(12, 9)" class="logo-icon">
    <g transform="scale(0.85)" fill="#ffffff"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 14.93V17h-2v-.07A8.006 8.006 0 014.07 13H5v-2h-.93A8.006 8.006 0 017 4.07V5h2v-.93A8.006 8.006 0 0113 4.07V5h2v-.93A8.006 8.006 0 0119.93 11H19v2h.93A8.006 8.006 0 0113 16.93zM8 12a4 4 0 118 0 4 4 0 01-8 0z"/></g>
  </g>

  <text x="40" y="23" class="badge-text">KiCad PCB Design</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 38" width="158" height="38">
  <defs>
    <!-- Rich Metallic Luster Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- 3D Specular Glass Highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Metallic Specular Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>

    <!-- Dynamic Lustre Beam (Motion Sweep) -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <mask id="badgeMask">
      <rect x="1" y="1" width="156" height="36" rx="7" fill="#ffffff" />
    </mask>

    <style>
      @keyframes gleam {
        0% { transform: translateX(-140px) skewX(-25deg); opacity: 0; }
        8% { opacity: 0.9; }
        28% { transform: translateX(278px) skewX(-25deg); opacity: 0.9; }
        35%, 100% { transform: translateX(278px) skewX(-25deg); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 1px rgba(255,255,255,0.4)); }
        50% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 8px #4ade80); }
      }
      .sheen {
        animation: gleam 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        animation-delay: 0.75s;
      }
      .logo-icon {
        animation: pulseGlow 2.5s ease-in-out infinite;
        animation-delay: 0.75s;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Shadow Base -->
  <rect x="1" y="2" width="156" height="35" rx="7" fill="#000000" opacity="0.35" />

  <!-- Main Badge Pill -->
  <rect x="1" y="1" width="156" height="35" rx="7" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Glass Top Reflection for 3D Luster -->
  <rect x="1" y="1" width="156" height="17" rx="7" fill="url(#glassGrad)" />

  <!-- Animated Moving Lustre Light Sweep -->
  <g mask="url(#badgeMask)">
    <rect x="-120" y="-10" width="55" height="60" fill="url(#sheenGrad)" class="sheen" />
  </g>

  <!-- Icon + Text Content -->
  <g transform="translate(12, 9)" class="logo-icon">
    <g transform="scale(0.85)" fill="#ffffff"><path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-4.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 2.23 12.95 2 12 2c-.96 0-1.86.23-2.66.63L7.85 1.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.3C6.71 4.32 5.5 6.27 5.5 8.5h13c0-2.23-1.21-4.18-2.97-5.34z"/></g>
  </g>

  <text x="40" y="23" class="badge-text">Android Native</text>
</svg>
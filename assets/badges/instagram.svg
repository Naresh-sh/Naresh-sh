<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 145 38" width="145" height="38">
  <defs>
    <!-- Background Gradient with Rich Lustre -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1306c" />
      <stop offset="50%" stop-color="#fd1d1d" />
      <stop offset="100%" stop-color="#833ab4" />
    </linearGradient>

    <!-- Glass Top Reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glowing Metallic Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Lustre Sheen Beam -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Mask for Clip -->
    <mask id="badgeMask">
      <rect x="1" y="1" width="143" height="36" rx="7" fill="#ffffff" />
    </mask>

    <style>
      @keyframes gleam {
        0% { transform: translateX(-140px) skewX(-25deg); opacity: 0; }
        8% { opacity: 0.85; }
        28% { transform: translateX(265px) skewX(-25deg); opacity: 0.85; }
        35%, 100% { transform: translateX(265px) skewX(-25deg); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 1px rgba(255,255,255,0.4)); }
        50% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 10px #e1306c); }
      }
      .sheen {
        animation: gleam 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        animation-delay: 0.8s;
      }
      .logo-icon {
        animation: pulseGlow 2.5s ease-in-out infinite;
        animation-delay: 0.8s;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Drop shadow base -->
  <rect x="1" y="2" width="143" height="35" rx="7" fill="#000000" opacity="0.35" />

  <!-- Main Badge Pill -->
  <rect x="1" y="1" width="143" height="35" rx="7" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Glass Top Reflection for 3D Luster -->
  <rect x="1" y="1" width="143" height="17" rx="7" fill="url(#glassGrad)" />

  <!-- Animated Moving Lustre Light Sweep -->
  <g mask="url(#badgeMask)">
    <rect x="-120" y="-10" width="55" height="60" fill="url(#sheenGrad)" class="sheen" />
  </g>

  <!-- Icon + Text Content -->
  <g transform="translate(12, 9)" class="logo-icon">
    <g transform="scale(0.85) translate(1, 1)" fill="#ffffff">
  <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
</g>
  </g>

  <text x="40" y="23" class="badge-text">Instagram</text>
</svg>
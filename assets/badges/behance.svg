<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 38" width="135" height="38">
  <defs>
    <!-- Background Gradient with Rich Lustre -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d8aff" />
      <stop offset="50%" stop-color="#1769ff" />
      <stop offset="100%" stop-color="#0047cc" />
    </linearGradient>

    <!-- Glass Top Reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glowing Metallic Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Lustre Sheen Beam -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Mask for Clip -->
    <mask id="badgeMask">
      <rect x="1" y="1" width="133" height="36" rx="7" fill="#ffffff" />
    </mask>

    <style>
      @keyframes gleam {
        0% { transform: translateX(-140px) skewX(-25deg); opacity: 0; }
        8% { opacity: 0.85; }
        28% { transform: translateX(255px) skewX(-25deg); opacity: 0.85; }
        35%, 100% { transform: translateX(255px) skewX(-25deg); opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 1px rgba(255,255,255,0.4)); }
        50% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.95)) drop-shadow(0 0 10px #3d8aff); }
      }
      .sheen {
        animation: gleam 4s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        animation-delay: 0.4s;
      }
      .logo-icon {
        animation: pulseGlow 2.5s ease-in-out infinite;
        animation-delay: 0.4s;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Drop shadow base -->
  <rect x="1" y="2" width="133" height="35" rx="7" fill="#000000" opacity="0.35" />

  <!-- Main Badge Pill -->
  <rect x="1" y="1" width="133" height="35" rx="7" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Glass Top Reflection for 3D Luster -->
  <rect x="1" y="1" width="133" height="17" rx="7" fill="url(#glassGrad)" />

  <!-- Animated Moving Lustre Light Sweep -->
  <g mask="url(#badgeMask)">
    <rect x="-120" y="-10" width="55" height="60" fill="url(#sheenGrad)" class="sheen" />
  </g>

  <!-- Icon + Text Content -->
  <g transform="translate(12, 9)" class="logo-icon">
    <path d="M18 5.5h-5.5v-1.5h5.5v1.5zm1.35 7.8c-.35 1-1.6 2.35-4.05 2.35-2.7 0-4.35-1.6-4.35-4.45 0-2.65 1.75-4.5 4.3-4.5 2.65 0 4.1 1.85 3.9 4.7h-5.95c.03 1.3.75 2.1 2.15 2.1 1.15 0 1.85-.5 2.15-1h1.85zm-5.75-3.3h3.85c-.06-1.1-.65-1.7-1.85-1.7-1.2 0-1.85.6-2 1.7zm-8.85 5.65h-3.9v-10.15h4.45c2.7 0 4.1 1.15 4.1 3.05 0 1.2-.6 2.05-1.6 2.5 1.25.35 1.9 1.35 1.9 2.7 0 2.15-1.65 3.45-4.95 3.45zm-1.8-6.1h2.1c1.4 0 2.1-.5 2.1-1.5 0-1-.7-1.45-2.05-1.45h-2.15v2.95zm0 4.2h2.25c1.5 0 2.3-.55 2.3-1.65 0-1.1-.75-1.65-2.25-1.65h-2.3v3.3z" transform="scale(0.95)" fill="#ffffff"/>
  </g>

  <text x="40" y="23" class="badge-text">Behance</text>
</svg>
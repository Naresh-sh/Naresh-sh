<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="auto">
  <defs>
    <linearGradient id="dinoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <style>
      /* Scrolling ground dots */
      @keyframes scrollGround {
        0% { transform: translateX(0); }
        100% { transform: translateX(-160px); }
      }
      /* Clouds drifting */
      @keyframes cloudDrift1 {
        0% { transform: translateX(450px); }
        100% { transform: translateX(-80px); }
      }
      @keyframes cloudDrift2 {
        0% { transform: translateX(200px); }
        100% { transform: translateX(-100px); }
      }
      /* Cacti sliding left */
      @keyframes cactusMove {
        0% { transform: translateX(460px); }
        100% { transform: translateX(-60px); }
      }
      /* Dino Jump: cactus takes 3s to cross. Dino is at x=70. Cactus reaches x=70 around 75% of travel -> jump at 65%-85% */
      @keyframes dinoJump {
        0%, 55% { transform: translate(70px, 175px); }
        66% { transform: translate(70px, 95px); } /* Apex of jump */
        77% { transform: translate(70px, 175px); } /* Land */
        100% { transform: translate(70px, 175px); }
      }
      /* Leg running alternate */
      @keyframes leg1 {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      @keyframes leg2 {
        0%, 50% { opacity: 0; }
        51%, 100% { opacity: 1; }
      }
      .ground-track { animation: scrollGround 1.2s linear infinite; }
      .cloud1 { animation: cloudDrift1 12s linear infinite; }
      .cloud2 { animation: cloudDrift2 18s linear infinite; }
      .cactus-group { animation: cactusMove 3s linear infinite; }
      .dino-sprite { animation: dinoJump 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .leg-a { animation: leg1 0.2s steps(1) infinite; }
      .leg-b { animation: leg2 0.2s steps(1) infinite; }
      .hud-text { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: bold; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="496" height="416" rx="8" fill="url(#dinoBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="2" y="2" width="496" height="32" rx="8" fill="#0f172a"/>
  <circle cx="16" cy="16" r="4.5" fill="#ef4444"/>
  <circle cx="30" cy="16" r="4.5" fill="#f59e0b"/>
  <circle cx="44" cy="16" r="4.5" fill="#10b981"/>
  <text x="250" y="20" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8" font-weight="bold">ARCADE: CHROME DINO RUNNER // 8-BIT</text>

  <!-- Score HUD -->
  <rect x="20" y="42" width="460" height="32" rx="4" fill="#030712" stroke="#1e293b"/>
  <text x="35" y="62" class="hud-text">HI: <tspan fill="#f59e0b">02480</tspan></text>
  <text x="210" y="62" class="hud-text">CURRENT: <tspan fill="#38bdf8">00980</tspan></text>
  <text x="375" y="62" class="hud-text">STATUS: <tspan fill="#10b981">SURVIVING</tspan></text>

  <!-- Playfield -->
  <g transform="translate(20, 84)">
    <rect x="0" y="0" width="460" height="280" rx="6" fill="#02060b" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Clouds in sky -->
    <g class="cloud1" fill="#334155" opacity="0.5">
      <rect x="0" y="40" width="45" height="12" rx="6"/>
      <rect x="10" y="32" width="25" height="12" rx="6"/>
    </g>
    <g class="cloud2" fill="#334155" opacity="0.4">
      <rect x="0" y="70" width="55" height="14" rx="7"/>
      <rect x="15" y="60" width="30" height="14" rx="7"/>
    </g>

    <!-- Ground Horizon Line -->
    <line x1="0" y1="230" x2="460" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" class="ground-track"/>
    <line x1="0" y1="235" x2="460" y2="235" stroke="#334155" stroke-width="1" stroke-dasharray="3 8" class="ground-track"/>

    <!-- Moving Cactus Obstacle -->
    <g class="cactus-group">
      <!-- Main trunk -->
      <rect x="0" y="190" width="12" height="40" rx="3" fill="#10b981"/>
      <!-- Left arm -->
      <path d="M-8 200 L-8 212 L0 212" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Right arm -->
      <path d="M20 196 L20 206 L12 206" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- T-Rex Dino Sprite -->
    <g class="dino-sprite">
      <!-- Dino Body & Head (Pixel silhouette) -->
      <path d="M20 0 H40 V16 H36 V24 H28 V20 H20 V28 H16 V32 H12 V36 H8 V40 H0 V28 H8 V20 H12 V12 H16 V8 H20 Z" fill="#38bdf8"/>
      <!-- Eye -->
      <rect x="26" y="4" width="4" height="4" fill="#02060b"/>
      <!-- Little arm -->
      <rect x="28" y="22" width="8" height="3" fill="#38bdf8"/>
      
      <!-- Running Leg A -->
      <g class="leg-a">
        <rect x="4" y="40" width="4" height="15" fill="#38bdf8"/>
        <rect x="16" y="40" width="4" height="8" fill="#38bdf8"/>
      </g>
      <!-- Running Leg B -->
      <g class="leg-b">
        <rect x="4" y="40" width="4" height="8" fill="#38bdf8"/>
        <rect x="16" y="40" width="4" height="15" fill="#38bdf8"/>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <rect x="20" y="374" width="460" height="34" rx="4" fill="#030712" stroke="#1e293b"/>
  <text x="35" y="395" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">
    CONTROLS: [SPACE / ⬆️] JUMP &amp; DUCK
  </text>
  <text x="465" y="395" text-anchor="end" font-family="'Fira Code', monospace" font-size="11" fill="#38bdf8" font-weight="bold">
    🦖 SPEED: 120 KM/H
  </text>
</svg>
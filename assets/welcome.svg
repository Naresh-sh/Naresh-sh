<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="auto">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s step-start infinite;
      }
      .prompt { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #00ff88; }
      .path { fill: #38bdf8; }
      .cmd { fill: #f8fafc; font-weight: bold; }
      .ascii { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #00ff88; font-weight: bold; filter: url(#glow); }
      .box { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 12px; fill: #94a3b8; }
      .key { fill: #38bdf8; font-weight: 600; }
      .val { fill: #f1f5f9; }
      .highlight { fill: #00ff88; font-weight: bold; }
      .badge-online { fill: #10b981; font-weight: bold; }
    </style>
  </defs>

